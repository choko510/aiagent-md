[project]
name = "aiagent-domain"
version = "0.3.0"
description = "Canonical shared contracts: generated Pydantic v2 models, int64 wire codec, ids, RPC wire auth (pure, no I/O)"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic==2.14.3", "jsonschema>=4.25.0"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
