[project]
name = "aiagent-skills"
version = "0.1.0"
description = "Immutable Agent Skill lifecycle, supply-chain validation and progressive disclosure (MKT-2)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiagent-core",
  "aiagent-domain",
  "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiagent_skills"]

[tool.uv.sources]
aiagent-core = { workspace = true }
aiagent-domain = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
