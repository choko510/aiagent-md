[project]
name = "aiagent-mcp-adapter"
version = "0.1.0"
description = "Generic MCP adapter: bounded discovery, schema validation, immutable registry and gateway-only execution"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp==2.3.0",
  "jsonschema>=4.25,<5",
  "httpx2>=2.16,<3",
  "pydantic>=2.9,<3",
  "anyio>=4.4,<5",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"