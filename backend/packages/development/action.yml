name: "AI-03 development contract tests"
description: "Offline Project/Git/Sandbox ports, Mock SCM and disposable Git fixture (not host verification)"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install isolated contract test dependency
      shell: bash
      run: python -m pip install --disable-pip-version-check "pytest==9.2.0"
    - name: Run AI-03 contract and Git fixture tests
      shell: bash
      run: bash backend/packages/development/scripts/ci_contracts.sh
