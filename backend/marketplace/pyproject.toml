[project]
name = "aiagent-marketplace"
version = "0.1.0"
description = "MKT-1 read-only Skills and MCP catalog adapter; development-only API"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.120,<1", "httpx>=0.28,<1", "uvicorn>=0.38,<1"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
