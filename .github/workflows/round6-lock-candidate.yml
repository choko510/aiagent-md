name: round6-lock-candidate-audit
on:
  push:
    branches: [main, review/round6-shared-contract-lock-candidate]
  pull_request:
    paths:
      - 'governance/round6/**'
      - '.github/workflows/round6-lock-candidate.yml'
permissions:
  contents: read
  pull-requests: read
jobs:
  verify-review-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 61 merged source PR HEADs and 85 main module blobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 governance/round6/validate_candidate.py
