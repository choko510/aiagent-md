name: MKT1 lockfile generation (temporary)
on:
  pull_request:
    paths:
      - ".github/workflows/marketplace-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/marketplace-mkt1-catalog-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate locks without executing dependency install scripts
        run: |
          npm install --prefix web --package-lock-only --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check uv
          uv lock --project backend/marketplace --no-progress
      - name: Emit scoped lock files into diagnostics for explicit PR commit
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for label, path in [
              ("MKT_NPM", "web/package-lock.json"),
              ("MKT_UV", "backend/marketplace/uv.lock"),
          ]:
              value = base64.b64encode(Path(path).read_bytes()).decode("ascii")
              print(f"{label}_BEGIN")
              for offset in range(0, len(value), 120):
                  print(value[offset:offset + 120])
              print(f"{label}_END")
          PY
