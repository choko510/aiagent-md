name: muse-secure-runtime-spec-audit
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'audit/muse/**'
      - 'audit/cross-contract/**'
      - 'contracts/muse/**'
      - 'governance/round6/**'
      - '.github/workflows/muse-secure-runtime-spec-audit.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'audit/muse/**'
      - 'audit/cross-contract/**'
      - 'contracts/muse/**'
      - 'governance/round6/**'
      - '.github/workflows/muse-secure-runtime-spec-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate 88-module inventory, provenance and semantic incompatibilities
        run: python3 audit/muse/validate_spec_migration.py
      - name: Install exact JSON Schema test dependency
        run: python3 -m pip install jsonschema==4.23.0
      - name: Validate proposal/admission/ExternalAction JSON Schema + adversarial cases
        run: python3 audit/muse/validate_contract_schemas.py
      - name: Cross-module contract drift and regression audit
        run: python3 audit/cross-contract/check_contract_consistency.py
      - name: Python-first migration static audit (ADR-036..040; not runtime verification)
        run: python3 audit/cross-contract/check_python_first.py
