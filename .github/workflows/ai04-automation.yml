name: AI-04 Automation isolated Mock
on:
  pull_request:
    paths:
      - 'backend/packages/automation/**'
      - '.github/workflows/ai04-automation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-style:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/step4-automation-campaign'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'ruff==0.17.4'
      - name: Apply Ruff safe fixes and formatting on the trusted source branch
        run: |
          ruff check --fix backend/packages/automation || true
          ruff format backend/packages/automation
          ruff check backend/packages/automation
          ruff format --check backend/packages/automation
      - name: Persist mechanical formatting
        run: |
          git add backend/packages/automation
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: AutomationのRuff整形を反映'
            git push origin "HEAD:${{ github.head_ref }}"
          fi
  bounded-campaign:
    needs: fix-style

    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and lint dependencies
        run: python -m pip install 'pytest==9.2.0' 'ruff>=0.14.0'
      - name: Bounded campaign, outbox, DST and restart Mock tests
        run: bash backend/packages/automation/scripts/ci.sh
