name: backend
# STEP 3 Python backend: lint/type/contracts, PostgreSQL integration (migrations, Run control, QueuePort/Outbox/
# Scheduler, gateways, Sentinel, E2E), runtime fault suite (PYRT-T on the formal stack), Linux cell enforcement,
# and the Compose network-isolation gate. KVM two-VM topology tests are NOT run here (no /dev/kvm on hosted runners).
on:
  pull_request:
    paths: ['backend/**', 'contracts/**', 'web/**', 'deploy/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'contracts/**', 'web/**', 'deploy/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: backend
env:
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.3'}
      - run: uv sync --locked
      - name: Generated contracts are up to date (canonical JSON Schema -> Pydantic / TS)
        run: uv run python tools/gen_contracts.py --check
      - run: uv run ruff check . ../deploy/kvm
      - run: uv run ruff format --check . ../deploy/kvm
      - run: uv run mypy packages/domain/src packages/core/src packages/gateways/src packages/sentinel/src packages/api/src packages/sandbox/src packages/runtime/src packages/browser/src packages/context/src packages/memory/src packages/development/src packages/automation/src packages/mcp_adapter/src ../deploy/kvm

  integration:
    name: integration (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.12']
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      AIAGENT_TEST_PG_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Web UI bundle for Playwright UI E2E
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.3'}
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: Install Chromium and enable unprivileged userns sandbox on Ubuntu 24.04
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          uv run --python ${{ matrix.python }} python -m playwright install --with-deps chromium
      - name: STEP 4 isolated mock and fixture tests (not production integration)
        env:
          AIAGENT_REQUIRE_CHROMIUM: "1"
        run: uv run --python ${{ matrix.python }} pytest -q -rs -p no:cacheprovider packages/context/tests packages/memory/tests packages/development/tests packages/automation/tests packages/browser/tests packages/sandbox/tests
      - name: Contracts, migrations, Run control, QueuePort/Outbox/Scheduler, gateways, Sentinel, E2E, production gates
        env:
          AIAGENT_REQUIRE_CHROMIUM: "1"
        run: >
          uv run --python ${{ matrix.python }} pytest -q -rA -p no:cacheprovider tests
          --ignore=tests/test_runtime_faults.py --ignore=tests/linux --ignore=tests/test_compose_isolation.py
          --ignore=tests/test_cell_e2e.py

  runtime-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      AIAGENT_TEST_PG_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.3'}
      - run: uv sync --locked
      - name: PYRT-T on the formal stack (real gateway/Sentinel processes, worker kills)
        run: uv run pytest -q -rA -p no:cacheprovider tests/test_runtime_faults.py

  host-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.3'}
      - run: uv sync --locked
      - name: Host verification unit & fail-closed gate suite
        run: uv run pytest -q -rA -p no:cacheprovider tests/host_verification
      - name: KVM capability, static topology, and dynamic probe (fail-closed without /dev/kvm)
        run: |
          uv run python - <<'PY'
          import json, subprocess, sys
          for cmd, kind in [
              ([sys.executable, "../deploy/kvm/acceptance.py", "capabilities"], "host_capabilities"),
              ([sys.executable, "../deploy/kvm/acceptance.py", "topology"], "static_topology"),
              ([sys.executable, "../deploy/kvm/dynamic_probe.py"], "dynamic_kvm_probe"),
          ]:
              p = subprocess.run(cmd, capture_output=True, text=True, check=False)
              data = json.loads(p.stdout)
              assert data["kind"] == kind, data
              assert p.returncode in (0, 2), (cmd, p.returncode, p.stderr)
          PY
      - name: Bounded JQ-SMOKE and quarantined PITR inspection probes against PostgreSQL
        env:
          PG_ADMIN_DSN: postgresql://postgres:ci@127.0.0.1:5432/postgres
          AIAGENT_HV_DISPOSABLE_PG_URL: postgresql://postgres:ci@127.0.0.1:5432/aiagent_hv_disposable
          AIAGENT_HV_RESTORE_DSN: postgresql://postgres:ci@127.0.0.1:5432/aiagent_hv_restored_quarantine
          AIAGENT_HV_ALLOW_WRITE: YES
        run: |
          uv run python - <<'PY'
          import os
          import psycopg
          from aiagent_core import admin, migrate

          admin_dsn = os.environ["PG_ADMIN_DSN"]
          with psycopg.connect(admin_dsn, autocommit=True) as c:
              c.execute("CREATE DATABASE aiagent_hv_disposable")
              c.execute("ALTER DATABASE aiagent_hv_disposable SET aiagent.hv_disposable = 'aiagent-hv-disposable-v1'")
              c.execute("CREATE DATABASE aiagent_hv_restored_quarantine")
          restore_dsn = os.environ["AIAGENT_HV_RESTORE_DSN"]
          migrate.up(restore_dsn)
          admin.restore_bump(restore_dsn)
          with psycopg.connect(restore_dsn, autocommit=True) as c:
              c.execute("UPDATE queue.queues SET paused = true")
          PY
          uv run python ../deploy/kvm/queue_gate.py --rows 100 --relays 1 --consumers 1 --outage 0.5 --max-seconds 60 --execute --ack ALLOW_DISPOSABLE_DB_WRITE
          uv run python ../deploy/kvm/restore_probe.py --inspect

  cell-and-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      AIAGENT_TEST_PG_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.3'}
      - run: uv sync --locked
      - name: Allow unprivileged user namespaces for the cell's network namespace (Ubuntu 24.04 AppArmor default)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Cell dependencies built for the cell's own interpreter (python:3.13-slim, not the runner's Python)
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.13-slim             pip install -q --disable-pip-version-check --target /w/.linuxdeps pydantic==2.14.3 'jsonschema>=4.25.0' pytest
      - name: Runtime Cell enforcement (rlimits, process group kill, netns, uid drop, single-use grants)
        run: |
          docker run --rm --network none --cap-add SYS_ADMIN --security-opt seccomp=unconfined             --security-opt apparmor=unconfined -e AIAGENT_EXPECT_NETNS=1 -v "$PWD:/w" -w /w python:3.13-slim             sh -c "PYTHONPATH=/w/.linuxdeps:packages/domain/src:packages/sandbox/src               python -m pytest -q -rA -p no:cacheprovider --confcutdir tests/linux -c /dev/null tests/linux"
      - name: Generated code runs only in Docker cell (same-kernel RPC with grants; not KVM)
        run: uv run pytest -q -rA -p no:cacheprovider tests/test_cell_e2e.py
      - name: Real SCIP source-to-publication integration (test-only Docker Cell)
        run: |
          uv run python packages/development/scripts/scip_cell_fixture/build_fixture.py
          AIAGENT_SCIP_E2E=1 uv run pytest -q -rA -p no:cacheprovider tests/test_scip_production_e2e.py
      - name: Approved command fixture (test-only Docker Cell)
        run: |
          fixture_image=$(docker image inspect codex-dev13-scip-cell-fixture --format '{{.Id}}')
          docker run --rm --read-only --network none --cap-add SYS_ADMIN --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined --memory 3g --pids-limit 256 --tmpfs /tmp:exec,mode=1777,size=256m \
            -e AIAGENT_SCIP_FIXTURE=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/w/packages/domain/src:/w/packages/core/src:/w/packages/gateways/src:/w/packages/sandbox/src:/w/packages/development/src \
            -v "$PWD:/w:ro" -w /w "$fixture_image" python -m pytest -q --noconftest -p no:cacheprovider -c /dev/null tests/test_command_supervisor_fixture.py
      - name: Development Adapter command integration (test-only Docker Cell)
        run: AIAGENT_COMMAND_E2E=1 uv run pytest -q -rA -p no:cacheprovider tests/test_command_adapter_e2e.py
      - name: Authenticated Git worker fixture (test-only Docker, simulated authority)
        run: AIAGENT_GIT_WORKER_E2E=1 uv run pytest -q -rA -p no:cacheprovider tests/test_git_worker_docker.py
      - name: Git Gateway, CAS fence, and recovery E2E (test-only Docker)
        run: AIAGENT_GIT_GATEWAY_E2E=1 uv run pytest -q -rA -p no:cacheprovider tests/test_git_gateway_e2e.py
      - name: Build images
        working-directory: .
        run: |
          docker build -q -f deploy/docker/Dockerfile --target runtime-base \
            --build-arg PACKAGES="aiagent-gateways aiagent-sentinel aiagent-api aiagent-runtime" -t aiagent/all:dev .
          docker build -q -f deploy/docker/Dockerfile.cell -t aiagent/cell:dev .
      - name: Pinned nihongo bundle is verified, embedded as Lite and served read-only
        working-directory: .
        run: |
          docker run --rm --network none --entrypoint python aiagent/all:dev -c '
          import hashlib, os
          from aiagent_domain.tools import (
              NIHONGO_AUTHORITY_BOUNDARY, SKILLS_DIR, packaged_nihongo_full, packaged_nihongo_lite,
              packaged_skill_texts,
          )
          from aiagent_gateways.model_gateway import context_system_prompt
          from aiagent_gateways.tool_gateway import _grounded_packaged_skill_read
          from aiagent_runtime.agent import SYSTEM_PROMPT, _fs_backend
          from deepagents.middleware.filesystem import _prepare_read_window, _truncate_paginated_read

          skill = SKILLS_DIR / "nihongo"
          files = sorted((p for p in skill.rglob("*") if p.is_file()), key=lambda p: p.relative_to(skill).as_posix())
          assert len(files) == 25 and sum(p.stat().st_size for p in files) == 112849
          assert not (skill / "WEB.md").exists() and not (skill / "scripts").exists()
          assert not any(p.suffix in {".py", ".sh", ".js"} for p in skill.rglob("*"))
          assert all(not os.access(p, os.W_OK) for p in [*files, *skill.rglob("*")])

          def fingerprint():
              digest = hashlib.sha256()
              for path in files:
                  rel = path.relative_to(skill).as_posix()
                  digest.update(rel.encode("utf-8") + b"\0" + hashlib.sha256(path.read_bytes()).digest())
              return digest.hexdigest()

          assert fingerprint() == "6b8d5a9fbaf9f2135cc79920bc93a39df65433cee89a35951b33226911037ad8"
          all_text = "".join(packaged_skill_texts())
          assert "yomiyasu" not in all_text.lower()
          assert (skill / "references" / "marketing-copy.md").is_file()
          assert (skill / "references" / "technical-writing.md").is_file()
          assert (skill / "references" / "register.md").is_file()
          assert "version: \"3.1.1\"" in (skill / "SKILL.md").read_text(encoding="utf-8")
          assert (skill / "LICENSE").is_file()

          lite = packaged_nihongo_lite()
          full = packaged_nihongo_full()
          assert lite in SYSTEM_PROMPT and full not in SYSTEM_PROMPT
          assert NIHONGO_AUTHORITY_BOUNDARY in SYSTEM_PROMPT
          assert SYSTEM_PROMPT.index(lite) < SYSTEM_PROMPT.index(NIHONGO_AUTHORITY_BOUNDARY)
          assert "marketing-copy.md" in SYSTEM_PROMPT
          context_lite = context_system_prompt()
          assert NIHONGO_AUTHORITY_BOUNDARY in context_lite
          assert context_lite.index(lite) < context_lite.index(NIHONGO_AUTHORITY_BOUNDARY)
          assert full in context_system_prompt(full=True)

          def read_all(path, limit):
              offset = 0
              for _ in range(20):
                  result = _fs_backend().read(path, offset=offset, limit=limit)
                  assert result.file_data is not None and not result.error
                  normalized, body = _prepare_read_window(result, result.file_data["content"], offset)
                  rendered = _truncate_paginated_read(body, path, normalized, None)
                  assert _grounded_packaged_skill_read(rendered, {"file_path": path, "offset": offset, "limit": limit})
                  assert normalized.start_line == offset + 1
                  if normalized.next_offset is None:
                      return offset
                  assert normalized.next_offset > offset
                  offset = normalized.next_offset
              raise AssertionError("pagination did not finish")

          assert read_all("/skills/nihongo/SKILL.md", 20) > 0
          assert read_all("/skills/nihongo/references/technical-writing.md", 20) > 0
          '
      - name: Compose network isolation gate (dev topology)
        working-directory: .
        run: |
          sudo sh deploy/scripts/gen-secrets.sh  # root:10001 0440 so non-root services can read bind-mounted secrets
          export AIAGENT_MEMORY_TOMBSTONE_VOLUME=aiagentdev-memory-tombstones
          docker volume create "$AIAGENT_MEMORY_TOMBSTONE_VOLUME"
          docker run --rm --user 0:0 -v "$AIAGENT_MEMORY_TOMBSTONE_VOLUME:/data" aiagent/all:dev chown 10001:10001 /data
          docker compose -p aiagentdev -f deploy/compose/compose.yaml -f deploy/compose/compose.dev.yaml \
            run --rm --no-deps --entrypoint python migrate -m aiagent_core.admin memory-tombstone-init
          docker compose -p aiagentdev -f deploy/compose/compose.yaml -f deploy/compose/compose.dev.yaml up -d --wait
          cd backend && AIAGENT_COMPOSE_PROJECT=aiagentdev uv run pytest -q -rA -p no:cacheprovider tests/test_compose_isolation.py
      - name: Compose logs on failure
        if: failure()
        working-directory: .
        run: docker compose -p aiagentdev -f deploy/compose/compose.yaml -f deploy/compose/compose.dev.yaml logs --no-color | tail -300
