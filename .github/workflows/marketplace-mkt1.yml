name: Marketplace MKT-1 (offline contract and UI)
on:
  pull_request:
    paths:
      - "backend/marketplace/**"
      - "web/**"
      - ".github/workflows/marketplace-mkt1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Read-only catalog adapters and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install only MKT-1 test dependencies
        run: python -m pip install -e "./backend/marketplace[test]"
      - name: Compile and test offline (no external registry calls)
        run: |
          python -m compileall -q backend/marketplace/src
          python -m pytest backend/marketplace/tests -q

  web:
    name: Marketplace UI TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund
      - name: Strict typecheck and build
        run: npm run build
