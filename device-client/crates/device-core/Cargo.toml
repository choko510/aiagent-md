[package]
name = "aiagent-device-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fail-closed local device simulation; not a production gateway"

[dependencies]
aiagent-device-transport = { path = "../device-transport" }
chacha20poly1305 = "=0.10.1"
ed25519-dalek = "=2.2.0"
hkdf = "=0.12.4"
jsonschema = { version = "=0.63.1", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
zeroize = "=1.9.2"

[target.'cfg(windows)'.dependencies]
url = "2"

[dev-dependencies]
aiagent-device-transport = { path = "../device-transport", features = ["test-ca"] }
futures-util = "0.3"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "=0.28.0"
url = "2"
