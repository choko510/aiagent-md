[package]
name = "aiagent-device-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fail-closed local device simulation; not a production gateway"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
